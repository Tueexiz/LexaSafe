# ==============================================================================
# LEXASAFE FRANCE - REVERSE PROXY NGINX DURCI (OBJECTIF SECNUMCLOUD)
# TLS 1.3 • HSTS Preload • CSP Stricte • Restriction VPN WireGuard sur /admin
# ==============================================================================

server {
    listen 80;
    server_name lexasafe.fr auth.lexasafe.fr api.lexasafe.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lexasafe.fr auth.lexasafe.fr api.lexasafe.fr;

    # Certificats TLS Souverains
    ssl_certificate /etc/ssl/certs/lexasafe_bundle.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;

    # Durcissement Cryptographique TLS 1.3 Strict
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # En-têtes de Sécurité Maximale
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Limitation du débit de requêtes (Anti-DDoS / Brute Force)
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=15r/s;
    limit_req zone=req_limit burst=25 nodelay;

    # 1. Accès Public (Landing Page, CGU, Mentions, Démo)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Espace Administration Protégé (Sous-réseau WireGuard 10.88.0.0/24 UNIQUEMENT)
    location /admin.html {
        allow 10.88.0.0/24;
        allow 127.0.0.1;
        deny all;
        try_files $uri =404;
    }

    # 3. API Backend Pass-Through
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
