# ==============================================================================
# LEXASAFE FRANCE - NGINX REVERSE PROXY (SECNUMCLOUD OVH)
# TLS 1.3 • HSTS Preload • CSP Stricte • 3 domaines Next.js + API
# ==============================================================================

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=15r/s;

upstream web_app { server web:3000; }
upstream auth_app { server auth:3001; }
upstream dashboard_app { server dashboard:3002; }
upstream api_backend { server backend:8000; }

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name lexasafe.fr auth.lexasafe.fr app.lexasafe.fr api.lexasafe.fr;
    return 301 https://$host$request_uri;
}

# ── lexasafe.fr — Landing ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe_bundle.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.lexasafe.fr;" always;

    limit_req zone=req_limit burst=25 nodelay;

    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── auth.lexasafe.fr — Portail A2F ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name auth.lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe_bundle.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.lexasafe.fr;" always;

    limit_req zone=req_limit burst=10 nodelay;

    location / {
        proxy_pass http://auth_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── app.lexasafe.fr — Dashboards ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe_bundle.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.lexasafe.fr;" always;

    # Admin checklist — VPN WireGuard uniquement
    location /admin {
        allow 10.88.0.0/24;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://dashboard_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-VPN-Authorized "true";
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://dashboard_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── api.lexasafe.fr — FastAPI Backend ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe_bundle.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=req_limit burst=15 nodelay;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
