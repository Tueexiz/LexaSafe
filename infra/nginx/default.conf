# LEXASAFE FRANCE - REVERSE PROXY NGINX SÉCURISÉ (Zero Trust)
# Configuration ANSSI / Qualys SSL Labs A+

server_tokens off;

# Configuration des timeouts pour prévenir les attaques Slowloris
client_body_timeout 10;
client_header_timeout 10;
keepalive_timeout 15;
send_timeout 10;

# Limite de taille pour empêcher l'épuisement mémoire
client_max_body_size 50M;

# Serveur de redirection HTTP -> HTTPS
server {
    listen 80;
    server_name lexasafe.fr app.lexasafe.fr auth.lexasafe.fr api.lexasafe.fr;
    return 301 https://$host$request_uri;
}

# Configuration SSL/TLS 1.3 Strict
server {
    listen 443 ssl http2;
    server_name lexasafe.fr;

    # Ces certificats doivent être générés via Let's Encrypt / Certbot sur l'hôte, 
    # ou montés via /etc/ssl en SecNumCloud.
    ssl_certificate /etc/ssl/certs/lexasafe.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # En-têtes de Sécurité (HSTS, CSP, X-Frame-Options)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.lexasafe.fr;" always;

    # App principale (Web)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name auth.lexasafe.fr;

    ssl_certificate /etc/ssl/certs/lexasafe.crt;
    ssl_certificate_key /etc/ssl/private/lexasafe.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://auth:3001;
